# Build and tests on Linux (README "Build and tests")
name: Linux

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git cmake make g++

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: |
          cmake -S . -B build
          cmake --build build -j"$(nproc)"

      # A code generation bug can make a script loop forever : each test has a timeout
      - name: Tests
        working-directory: build/bin
        run: |
          for test in skalang_test skalang_bytecode_generator_test skalang_bytecode_serializer_test skalang_bytecode_interpreter_test; do
            timeout 600 "./$test"
          done

      - name: Script tests
        working-directory: build
        run: ctest --output-on-failure --timeout 300
